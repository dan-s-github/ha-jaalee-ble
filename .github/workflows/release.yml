name: Release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: "Version increment"
        required: true
        default: PATCH
        type: choice
        options:
          - PATCH
          - MINOR
          - MAJOR
          - PATCH_RC
          - MINOR_RC
          - MAJOR_RC

permissions:
  contents: write

jobs:
  release:
    name: Commitizen release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Generate GitHub App token
        id: app_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app_token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "uv.lock"

      - name: Install uv
        run: python3 -m pip install uv==0.13.6

      - name: Sync dependencies
        run: uv sync --group dev --frozen

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version and create changelog
        run: |
          INCREMENT=$(echo "${{ inputs.increment }}" | sed 's/_RC$//')
          if [[ "${{ inputs.increment }}" == *_RC ]]; then
            uv run --group dev cz bump --yes --changelog --increment "$INCREMENT" --prerelease rc
          else
            uv run --group dev cz bump --yes --changelog --increment "$INCREMENT"
          fi

      - name: Push commit and tags
        run: |
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin --tags

      - name: Resolve release tag
        id: release_tag
        run: echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

      - name: Verify release tag on origin
        run: git ls-remote --exit-code --tags origin "refs/tags/${{ steps.release_tag.outputs.tag }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          TAG="${{ steps.release_tag.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping creation."
            exit 0
          fi
          # --generate-notes only lists merged PRs, so lead with this release's
          # CHANGELOG.md section (minus its heading) to cover direct commits. Use
          # the file cz bump just wrote rather than `cz changelog --dry-run`, which
          # ignores changelog_merge_prerelease and would drop the RCs' entries.
          # Fails the step if the section is missing.
          awk -v tag="$TAG" '
            index($0, "## " tag " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { exit !found }
          ' CHANGELOG.md > release-notes.md
          if [[ "${{ inputs.increment }}" == *_RC ]]; then
            # Mark RCs as prereleases so HACS only offers them to beta users.
            EXTRA_ARGS=(--prerelease)
          else
            # Compare against the previous final release, not the latest RC, so
            # the PR list covers everything shipped in this release's RCs.
            PREV_TAG=$(git describe --tags --abbrev=0 --exclude '*rc*' "$TAG^")
            EXTRA_ARGS=(--notes-start-tag "$PREV_TAG")
          fi
          gh release create "$TAG" --notes-file release-notes.md --generate-notes "${EXTRA_ARGS[@]}"
